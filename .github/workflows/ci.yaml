name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TOOLS: ${{ github.workspace }}/..
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Instalar ferramentas
        run: |
          npm install --prefix "$TOOLS" --no-audit --no-fund --loglevel=error \
            prettier@3 \
            html-validate@9 \
            stylelint@16 stylelint-config-standard@37 \
            eslint@9 @eslint/js@9 globals
          echo "$TOOLS/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Preparar configurações
        run: |
          echo '{"extends":["stylelint-config-standard"]}' > "$TOOLS/stylelint.json"
          cat > "$TOOLS/eslint.config.mjs" <<'EOF'
          import js from "@eslint/js";
          import globals from "globals";
          export default [
            js.configs.recommended,
            { languageOptions: { globals: globals.browser } }
          ];
          EOF

      - name: Formatação
        run: prettier --check .

      - name: HTML
        if: '!cancelled()'
        run: html-validate --preset recommended "**/*.html"

      - name: CSS
        if: '!cancelled()'
        run: stylelint "**/*.css" --config "$TOOLS/stylelint.json" --allow-empty-input

      - name: JavaScript
        if: '!cancelled()'
        run: eslint . --config "$TOOLS/eslint.config.mjs" --no-config-lookup
